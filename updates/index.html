<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日更新紀錄｜好想知道</title><style>body{margin:0;background:#12252e;color:#f3efe4;font:18px/1.8 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:40px 24px}a{color:#9cdbcb}h1{font-size:36px}article{margin:28px 0;padding:24px;border:1px solid #46616a;border-radius:12px;background:#1a313b}small{color:#b4c7cb}li{margin:10px 0}.note{color:#bdd1d6}button{font:inherit}h2{margin-top:0}</style><main><a href="../">← 回選舉網站</a><h1>每日更新紀錄</h1><p class="note">每日 10:00（台灣時間）啟動來源查核，完成驗證與上線後發布 Threads 紀錄。電腦須開機、使用者已登入且網路可用。更新至 2026/11/21 23:59，期後保留閱讀。</p><p>每日另查核兩則選舉話題，區分新增、進度更新與無新進度的來源複核。深入輪替縣市，並查核官方公告來源；這不代表每天完成全台逐人背景調查。未查得不等於無前科。司法、爭議與資格新線索仍須專項核實。</p><div id="entries">讀取中…</div></main><script>fetch('./index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(rows=>{const root=document.querySelector('#entries');root.textContent='';if(!rows.length){root.textContent='每日排程已準備，尚無完成的每日查核紀錄。';return}for(const e of rows){const card=document.createElement('article');for(const [tag,text] of [['h2',e.date+(e.kind==='manual'?'・人工續查':'')],['p',e.summary],['p','深入查核：'+e.county_scope.join('、')],['p','涉及 '+e.updated_people+' 位登記者；新增 '+e.accepted_facts+' 項來源資料。'],['small',e.kind==='manual'?'本輪補足經歷內容 '+e.coverage_change.new_biographies+' 人；各筆資料年份與限制見下方。':'待專項核實線索 '+e.review_leads_count+' 項；未通過匯入檢查 '+e.rejected_count+' 項。']]){const n=document.createElement(tag);n.textContent=text;card.append(n)}for(const topic of e.topic_updates||[]){const h=document.createElement('h3');h.textContent=topic.title;card.append(h);const p=document.createElement('p');p.textContent=({'new':'新增話題','progress':'進度更新','review':'來源複核・無新進度'}[topic.kind]||topic.kind)+'｜'+topic.summary;card.append(p)}const ul=document.createElement('ul');for(const s of e.official_checks){const li=document.createElement('li'),a=document.createElement('a');a.textContent=s.title;a.href=s.url;a.rel='noopener noreferrer';a.target='_blank';li.append(a);ul.append(li)}card.append(ul);for(const change of e.changes||[]){const p=document.createElement('p');p.textContent=change.county+'・'+change.name+'｜'+change.text;card.append(p)}for(const text of e.limitations){const p=document.createElement('p');p.className='note';p.textContent=text;card.append(p)}root.append(card)}}).catch(()=>document.querySelector('#entries').textContent='更新紀錄暫時無法讀取，請稍後重試。');</script></html>
